<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTime - Book Ticket</title>
    <style>
        body { background-color: #14213d; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; }
        #top { background-color: black; padding: 10px; position: sticky; top: 0; }
        h2 { color: gold; margin: 5px; }
        fieldset { width: 450px; max-width: 85%; margin: 20px auto; border: 1px solid gold; padding: 15px; }
        label { margin: 0 6px; }
        .screen { background-color: white; color: black; width: 70%; margin: 10px auto; border-radius: 20px; padding: 4px; }
        .error { color: tomato; font-size: 13px; margin: 8px 0 0 0; min-height: 15px; }
        button { background-color: gold; color: black; border: none; padding: 8px 20px; margin: 5px; cursor: pointer; }
        #result { display: none; width: 320px; max-width: 85%; margin: 20px auto; padding: 10px; border: 2px solid lightgreen; color: lightgreen; }
        p { margin: 5px; }
    </style>
</head>
<body>
    <div id="top">
        <h2>ShowTime Tickets</h2>
        <p id="welcome"></p>
        <button onclick="goBack()">Back to Movies</button>
    </div>

    <h3 id="movieName"></h3>

    <form>
       
        <fieldset>
            <h3>Select Show Time</h3>
            <input type="radio" id="t1" name="time" value="10:00 AM"><label for="t1">10:00 AM</label>
            <input type="radio" id="t2" name="time" value="1:30 PM"><label for="t2">1:30 PM</label>
            <input type="radio" id="t3" name="time" value="4:30 PM"><label for="t3">4:30 PM</label>
            <input type="radio" id="t4" name="time" value="7:30 PM"><label for="t4">7:30 PM</label>
            <p class="error" id="timeError"></p>
        </fieldset>

        <fieldset>
            <h3>Select Your Seats (maximum 6)</h3>
            <div class="screen">SCREEN</div>
           <b>A</b>
<label><input type="checkbox" name="seat" value="A1">1</label>
<label><input type="checkbox" name="seat" value="A2">2</label>
<label><input type="checkbox" name="seat" value="A3" disabled>3</label>
<label><input type="checkbox" name="seat" value="A4">4</label>
<label><input type="checkbox" name="seat" value="A5">5</label>
<label><input type="checkbox" name="seat" value="A6">6</label>
<br>

<b>B</b>
<label><input type="checkbox" name="seat" value="B1">1</label>
<label><input type="checkbox" name="seat" value="B2">2</label>
<label><input type="checkbox" name="seat" value="B3">3</label>
<label><input type="checkbox" name="seat" value="B4">4</label>
<label><input type="checkbox" name="seat" value="B5" disabled>5</label>
<label><input type="checkbox" name="seat" value="B6">6</label>
<br>

<b>C</b>
<label><input type="checkbox" name="seat" value="C1">1</label>
<label><input type="checkbox" name="seat" value="C2" disabled>2</label>
<label><input type="checkbox" name="seat" value="C3">3</label>
<label><input type="checkbox" name="seat" value="C4">4</label>
<label><input type="checkbox" name="seat" value="C5">5</label>
<label><input type="checkbox" name="seat" value="C6">6</label>
<br>
            <p>Rs. 250 per seat | Greyed seats are already booked</p>
            <p class="error" id="seatError"></p>
        </fieldset>

        <button type="button" onclick="confirmBooking()">Confirm Booking</button>
    </form>

    <div id="result">
        <h3>Booking Confirmed!</h3>
        <p id="sId"></p>
        <p id="sMovie"></p>
        <p id="sTime"></p>
        <p id="sSeats"></p>
        <p id="sTotal"></p>
        <p>Enjoy the movie!</p>
    </div>

    <script>
    // The address looks like: booking.html?user=Rahul&movie=Midnight Express
    var address = window.location.search;
    var user = "";
    var movie = "";

    // If "movie" is not in the address, the visitor skipped the earlier pages
    if (address.indexOf("movie") == -1) {
        window.location.href = "index.html";
    } else {
        // split("&") cuts the address into two parts: the user and the movie
        var parts = address.split("&");

        // split("=")[1] takes the value after the = sign
        // decodeURIComponent changes %20 back into a space
        user = decodeURIComponent(parts[0].split("=")[1]);
        movie = decodeURIComponent(parts[1].split("=")[1]);

        document.getElementById("welcome").innerText = "Logged in as " + user;
        document.getElementById("movieName").innerText = "Movie: " + movie;
    }

    // Runs when the "Back to Movies" button is clicked
    function goBack() {
        window.location.href = "movies.html?user=" + user;
    }

    // Runs when the "Confirm Booking" button is clicked
    function confirmBooking() {
        // Hide the old ticket (in case the user books again)
        document.getElementById("result").style.display = "none";

        // 1. Find which show time is selected
        var time = "";
        if (document.getElementById("t1").checked) { time = "10:00 AM"; }
        if (document.getElementById("t2").checked) { time = "1:30 PM"; }
        if (document.getElementById("t3").checked) { time = "4:30 PM"; }
        if (document.getElementById("t4").checked) { time = "7:30 PM"; }

        // 2. Count the ticked seats and note down their names
        var seats = "";
        var count = 0;
        var boxes = document.getElementsByName("seat");

        // This loop looks at every seat box one by one
        for (var i = 0; i < boxes.length; i++) {
            if (boxes[i].checked) {
                seats = seats + boxes[i].value + " ";
                count = count + 1;
            }
        }

        // 3. Validation
        if (time == "") {
            alert("Please select a show time.");
            return;
        }

        if (count == 0) {
            alert("Please select at least 1 seat.");
            return;
        }

        if (count > 6) {
            alert("You can select maximum 6 seats.");
            return;
        }

        // 4. Everything is correct, so show the ticket (Rs. 250 per seat)
        document.getElementById("sMovie").innerText = "Movie: " + movie;
        document.getElementById("sTime").innerText = "Show Time: " + time;
        document.getElementById("sSeats").innerText = "Seats: " + seats;
        document.getElementById("sTotal").innerText = "Total Amount: Rs. " + count * 250;
        document.getElementById("result").style.display = "block";
    }
</script>
</body>
</html>
