<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTime - Login</title>
    <style>
        body { background-color: #03163e; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; }
        #top { background-color: black; padding: 10px; }
        h2 { color: gold; margin: 5px; }
        fieldset { width: 320px; max-width: 85%; margin: 20px auto; text-align: left; border: 1px solid gold; padding: 15px; }
        input { width: 95%; padding: 6px; margin: 4px 0; }
        .error { color: tomato; font-size: 13px; margin: 0 0 8px 0; min-height: 15px; }
        button { background-color: gold; color: black; border: none; padding: 8px 20px; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="top">
        <h2>ShowTime Tickets</h2>
        <h6>Login or create an account to book your movie</h6>
    </div>
    <b><marquee style="color: gold;">Welcome! Sign up today and book your first movie.</marquee></b>

    <form>
        <fieldset>
            <h3>Login</h3>
            <label for="Email">E-mail:</label><br>
            <input type="text" id="Email" placeholder="enter email">
            <p class="error" id="EmailError"></p>

            <label for="Pass">Password:</label><br>
            <input type="password" id="Pass" placeholder="enter password">
            <p class="error" id="PassError"></p>

            <button type="button" onclick="login()">Login</button>
        </fieldset>
    </form>

    <form>
        <fieldset>
            <h3>New here? Sign Up</h3>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" placeholder="enter name">
            <p class="error" id="nameError"></p>

            <label for="email">E-mail:</label><br>
            <input type="text" id="email" placeholder="enter email">
            <p class="error" id="emailError"></p>

            <label for="number">Phone Number:</label><br>
            <input type="text" id="number" placeholder="10 digit number">
            <p class="error" id="phoneError"></p>

            <label for="pass">Password:</label><br>
            <input type="password" id="pass" placeholder="at least 6 characters">
            <p class="error" id="passError"></p>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" id="confirm" placeholder="type password again">
            <p class="error" id="confirmError"></p>

            <button type="button" onclick="signUp()">Sign Up</button>
        </fieldset>
    </form>

    <script>
        function login() {
            var email = document.getElementById("Email").value.trim();
            var pass = document.getElementById("Pass").value.trim();
            
            if (email === "") {
                document.getElementById("EmailError").innerText = "Please enter email";
                return;
            } else {
                document.getElementById("EmailError").innerText = "";
            }
            
            if (pass === "") {
                document.getElementById("PassError").innerText = "Please enter password";
                return;
            } else {
                document.getElementById("PassError").innerText = "";
            }

            var userName = email.split("@")[0];
            window.location.href = "movies.html?user=" + encodeURIComponent(userName);
        }

        function signUp() {
            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim();
            var number = document.getElementById("number").value.trim();
            var pass = document.getElementById("pass").value.trim();
            var confirm = document.getElementById("confirm").value.trim();

            if (name === "") {
                document.getElementById("nameError").innerText = "Please enter name";
                return;
            } else {
                document.getElementById("nameError").innerText = "";
            }

            if (email === "") {
                document.getElementById("emailError").innerText = "Please enter email";
                return;
            } else {
                document.getElementById("emailError").innerText = "";
            }

            if (number === "" || number.length !== 10) {
                document.getElementById("phoneError").innerText = "Please enter a valid 10-digit number";
                return;
            } else {
                document.getElementById("phoneError").innerText = "";
            }

            if (pass.length < 6) {
                document.getElementById("passError").innerText = "Password must be at least 6 characters";
                return;
            } else {
                document.getElementById("passError").innerText = "";
            }

            if (pass !== confirm) {
                document.getElementById("confirmError").innerText = "Passwords do not match";
                return;
            } else {
                document.getElementById("confirmError").innerText = "";
            }

            window.location.href = "movies.html?user=" + encodeURIComponent(name);
        }
    </script>
</body>
</html>
