<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTime - Login</title>
    <style>
        body { background-color: #03163e; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; }
        #top { background-color: black; padding: 10px; }
        h2 { color: gold; margin: 5px; }
        fieldset { width: 320px; max-width: 85%; margin: 20px auto; text-align: left; border: 1px solid gold; padding: 15px; }
        input { width: 95%; padding: 6px; margin: 4px 0; }
        .error { color: tomato; font-size: 13px; margin: 0 0 8px 0; min-height: 15px; }
        button { background-color: gold; color: black; border: none; padding: 8px 20px; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="top">
        <h2>ShowTime Tickets</h2>
        <h6>Login or create an account to book your movie</h6>
    </div>
    <b><marquee style="color: gold;">Welcome! Sign up today and book your first movie.</marquee></b>

   
    <form>
        <fieldset>
            <h3>Login</h3>
            <label for="Email">E-mail:</label><br>
            <input type="text" id="Email" placeholder="enter email">
            <p class="error" id="EmailError"></p>

            <label for="Pass">Password:</label><br>
            <input type="password" id="Pass" placeholder="enter password">
            <p class="error" id="PassError"></p>

            <button type="button" onclick="login()">Login</button>
        </fieldset>
    </form>
    <form>
        <fieldset>
            <h3>New here? Sign Up</h3>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" placeholder="enter name">
            <p class="error" id="nameError"></p>

            <label for="email">E-mail:</label><br>
            <input type="text" id="email" placeholder="enter email">
            <p class="error" id="emailError"></p>

            <label for="phone">Phone Number:</label><br>
            <input type="text" id="phone" placeholder="10 digit number">
            <p class="error" id="phoneError"></p>

            <label for="pass">Password:</label><br>
            <input type="password" id="pass" placeholder="at least 6 characters">
            <p class="error" id="passError"></p>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" id="confirm" placeholder="type password again">
            <p class="error" id="confirmError"></p>

            <button type="button" onclick="signUp()">Sign Up</button>
        </fieldset>
    </form>

<script>
   
    function login() {
        var email = document.getElementById("loginEmail").value.trim();
        var pass = document.getElementById("loginPass").value;


        if (email.indexOf("@") == -1 || email.indexOf(".") == -1) {
            alert("Enter a valid email like abc@gmail.com");
            return;   // stop here, do not go further
        }

        if (pass.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

       
        window.location.href = "movies.html?user=" + email;
    }

    
    function signUp() {
        var name = document.getElementById("name").value.trim();
        var email = document.getElementById("email").value.trim();
        var phone = document.getElementById("phone").value.trim();
        var pass = document.getElementById("pass").value;
        var confirmPass = document.getElementById("confirm").value;

        if (name.length < 3) {
            alert("Name must have at least 3 letters.");
            return;
        }

        if (email.indexOf("@") == -1 || email.indexOf(".") == -1) {
            alert("Enter a valid email like abc@gmail.com");
            return;
        }

        
        if (phone.length != 10 || isNaN(phone)) {
            alert("Phone number must be exactly 10 digits.");
            return;
        }

        if (pass.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

        if (confirmPass != pass) {
            alert("Passwords do not match.");
            return;
        }

        window.location.href = "movies.html?user=" + name;
    }
</script>
</body>
</html>
